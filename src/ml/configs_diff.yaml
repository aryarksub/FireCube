seed: 123

data:
  base_path: output/cubes
  batch_size: 4
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  target_var: fire_spread/farea
  step_hours: 12
  horizon_hours: 12
  hourly_agg: concat
  missing_value: -1.0
  compute_stats: false
  stats_path: src/ml/normalization.json
  stats_sample_limit: null
  required_vars:
    - fire_spread/fline
    - fire_spread/farea
    - fire_spread/nfp
    - fire_spread/frp
    - fuel_structure/cbd
    - fuel_structure/cbh
    - fuel_structure/cc
    - fuel_structure/ch
    - high_res_climate/lh
    - high_res_climate/lw
    - high_res_climate/m1
    - high_res_climate/m10
    - high_res_climate/m100
    - high_res_climate/wd
    - high_res_climate/ws
    - veg_fm_topo/evt
    - veg_fm_topo/fbfm13
    - veg_fm_topo/fbfm40
    - veg_fm_topo/roads
    - veg_fm_topo/asp
    - veg_fm_topo/elev
    - veg_fm_topo/slpd

model:
  patch: 4
  dim: 512
  depth: 10
  heads: 16
  mlp_dim: 1024
  out_ch: 1

train:
  run_dir: runs/diffusion
  ckpt_dir: runs/diffusion/checkpoints
  vis_dir: runs/diffusion/probability_maps
  metrics_path: runs/diffusion/metrics.csv
  grad_accum_steps: 4
  max_grad_norm: 1.0
  max_steps: 1000000
  val_every_steps: 500
  max_val_batches: 2
  val_visual_every: 5
  lr: 0.0003
  warmup_steps: 1000
  warmup_start_lr: 0.000005
  weight_decay: 0.0000001
  device: cuda
  log_every: 50
  ckpt_every_n_steps: 500
